name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets base-image-refresh.yml kick off a full run (test -> scan -> publish)
  # after it pushes a digest bump: pushes made with GITHUB_TOKEN don't trigger
  # `push` workflows, but workflow_dispatch is exempt from that rule.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm audit --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: metro-transit-map:ci

      # Fails the build on HIGH/CRITICAL CVEs that already have a fix
      # available -- i.e. ones a base-image digest bump or dependency update
      # can actually clear. Pinned by commit SHA rather than tag since
      # trivy-action's tags were hijacked in a 2026 supply-chain attack.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: metro-transit-map:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  # Builds the same image again (build-push-action doesn't support exporting
  # a `push: false` build to reuse here) and pushes it to GHCR, but only for
  # pushes to main -- PRs get the build-only check above, never a publish.
  # Every push to main is a release: this job bumps package.json's patch
  # version, commits and tags that itself, then builds the image from that
  # bumped commit so the version baked into it (read by server.js, exposed
  # via /api/status and the UI) always matches a real, findable git tag.
  # Skipped for the bump commit's own push (its "[skip ci]" message, which
  # GitHub also uses to skip the whole workflow for that push, so this `if`
  # only matters for a non-skipped run that still somehow carries the
  # message) to avoid double-bumping.
  publish:
    needs: [test, docker-build]
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, 'chore: bump version')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Bump version and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          new_version=$(npm version patch --no-git-tag-version)
          git commit -am "chore: bump version to ${new_version} [skip ci]"
          git tag "${new_version}"
          git push origin HEAD:main
          git push origin "${new_version}"
          echo "version=${new_version#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.bump.outputs.sha }}
            ghcr.io/${{ github.repository }}:v${{ steps.bump.outputs.version }}
