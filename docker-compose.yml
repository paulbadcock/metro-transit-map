services:
  app:
    container_name: busmap
    build: .
    ports:
      - "${PORT:-4040}:4040"
    volumes:
      - gtfs-data:/app/data/gtfs
    environment:
      - PORT=4040
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gtfs-data:
