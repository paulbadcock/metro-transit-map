services:
  app:
    container_name: busmap
    # image + build together: `docker compose up --build` builds locally from
    # the Dockerfile and tags it with this name (for local dev); on a server
    # that never builds, `docker compose pull && docker compose up -d` pulls
    # this same tag straight from GHCR instead -- see CI's `publish` job,
    # which pushes it on every merge to main.
    image: ghcr.io/paulbadcock/metro-transit-map:latest
    build: .
    ports:
      - "${PORT:-4040}:4040"
    volumes:
      - gtfs-data:/app/data/gtfs
    environment:
      - PORT=4040
      - TOMTOM_API_KEY=${TOMTOM_API_KEY:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gtfs-data:
